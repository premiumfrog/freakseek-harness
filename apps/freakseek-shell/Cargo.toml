[package]
name = "freakseek-shell"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "FreakSeek desktop shell: a Tauri window over the bundled FreakSeek runtime"
publish = false

[[bin]]
name = "FreakSeek"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
