# The dsh-offline bundle patch: layered after dsh-base (and dsh-headless for the
# CLI), it removes every dsh-base row that contacts a remote service on its own
# (DeepSeek model routes and request metadata, third-party model catalogs,
# account sign-in, telemetry, session-log upload, and npm-backed plugin
# installation) and serves models from local GGUF files instead. The desktop
# adds dsh-offline-app for the rows dsh-web-app contributes.
#
# The only remaining outbound traffic is model-initiated: the web search tool
# sends the query text to DuckDuckGo, and the web fetch tool retrieves the URL
# the model names. Disable `tool-web` to remove both.

# Model routes: only the local engine.
- id: llm-deepseek
  disabled: true
- id: llm-deepseek-account
  disabled: true
- id: llm-pi-ai
  disabled: true
- id: deepseek-llm-api-extensions
  disabled: true
- id: plugin-package-inventory-deepseek
  disabled: true
- id: session-log-deepseek
  disabled: true
- id: deepseek-account
  disabled: true

# Telemetry and analytics.
- id: otel
  disabled: true
- id: session-telemetry-otel
  disabled: true

# Plugin installation resolves packages from the npm registry.
- id: plugin-manager
  disabled: true
- id: tool-plugin-manager
  disabled: true

# Web search through the DeepSeek API is replaced by a direct DuckDuckGo query.
- id: web-search-deepseek
  disabled: true
- id: web-deepseek-api
  disabled: true
- id: web
  config:
    searchProvider: duckduckgo
    fetchProvider: http

# The fixed upstream identity line is dropped and the persona names this product.
# Agent presets (the desktop) supply their own persona section over this prefix.
- id: system-prompt
  config:
    includeHarnessIdentity: false
    personaPrefix: >-
      You are FreakSeek, a coding agent running on a local model on the user's computer.
      Work in the session's working directory: create, edit, and run files there.
      Ask the user before reading, creating, or changing anything outside it,
      and never inspect or modify FreakSeek's own installation.

# Lean tool surface for one local model. Every declared tool costs prompt
# tokens on each request, and small models call unfamiliar tools wrongly, so
# delegation (one engine runs one generation at a time), workflows, goals,
# background jobs, image reading (the local route is text-only), and the
# working-directory tool are left out. DSH_LOCAL_FULL_TOOLS=1 keeps them.
# The desktop's agent presets apply the same selection to their own rows.
- id: tool-subagent-control
  disabled: !!js process.env.DSH_LOCAL_FULL_TOOLS !== '1'
- id: tool-subagent
  disabled: !!js process.env.DSH_LOCAL_FULL_TOOLS !== '1'
- id: tool-subagent-fork
  disabled: !!js process.env.DSH_LOCAL_FULL_TOOLS !== '1'
- id: tool-agent-team
  disabled: !!js process.env.DSH_LOCAL_FULL_TOOLS !== '1'
- id: tool-workflow
  disabled: !!js process.env.DSH_LOCAL_FULL_TOOLS !== '1'
- id: tool-goal
  disabled: !!js process.env.DSH_LOCAL_FULL_TOOLS !== '1'
- id: tool-jobs
  disabled: !!js process.env.DSH_LOCAL_FULL_TOOLS !== '1'
- id: tool-working-directory
  disabled: !!js process.env.DSH_LOCAL_FULL_TOOLS !== '1'
- id: tool-bash
  config:
    enableRunInBackground: !!js process.env.DSH_LOCAL_FULL_TOOLS === '1'
- id: tool-pwsh
  config:
    enableRunInBackground: !!js process.env.DSH_LOCAL_FULL_TOOLS === '1'
- id: tool-fs
  config:
    applyPatch: false
    readImage: !!js process.env.DSH_LOCAL_FULL_TOOLS === '1'

# Session titles come from the first prompt's words: a model-written title is an extra
# generation that a single local engine runs before the conversation's next step.
- id: session-title-llm
  disabled: true

# Automatic compaction sized for local context windows (8k to 256k tokens): the
# default 65,536-token headroom exceeds a 32k window and would leave no budget.
# A conversation is summarized once it reaches 75% of the window, less the reply
# reservation and 2,048 tokens, keeping the newest 20% verbatim.
- id: compaction-basic
  config:
    thresholdRatio: 0.75
    headroomTokens: 2048
    maxTokens: 2048
    retainRatio: 0.2

# New conversations start on the local route; loading a model on the
# Local models page saves it here.
- id: agent-default-model
  config:
    provider: local
    model: !!js process.env.DSH_LOCAL_MODEL ?? 'default'

- insert:
    - id: llm-local-gguf
      name: '@deepseek-ai/dsh-llm-local-gguf'
      config:
        enginePath: !!js process.env.DSH_GGUF_ENGINE
        engineDirectory: !!js process.env.DSH_GGUF_ENGINE_DIR
        modelsRoot: !!js process.env.DSH_LOCAL_MODELS_ROOT
        modelDirectories: !!js "process.env.DSH_LOCAL_MODEL_DIRS?.split(process.platform === 'win32' ? ';' : ':')"
        device: !!js process.env.DSH_GGUF_DEVICE
        gpuLayers: !!js "process.env.DSH_GGUF_GPU_LAYERS === undefined ? undefined : Number(process.env.DSH_GGUF_GPU_LAYERS)"
        # The desktop app reloads the last model at startup; a CLI run loads the one it names.
        autoLoadLast: !!js process.env.FREAKSEEK_SHELL === 'stdio'

    - id: web-search-duckduckgo
      name: '@deepseek-ai/dsh-web-search-duckduckgo'
