name: FreakSeek · Windows x64 portable release

# Builds the standalone FreakSeek folder: the Tauri shell, the bundled Node
# agent runtime, a CPU engine and a CUDA engine (RTX 20-series and newer, with
# the CUDA DLLs it imports), an empty models folder, and the CLI launchers.
# Pre-build tests gate every other job; the engines and the app build in
# parallel; the last job assembles, zips, and publishes the folder.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create or update
        type: string
        default: freakseek-v0.2.0
        required: true
      compute_cap:
        description: Lowest CUDA compute capability the kernels target (75 = RTX 20-series; newer GPUs JIT the PTX)
        type: string
        default: '75'
        required: true
  push:
    tags: ['freakseek-v*']

permissions:
  contents: write

concurrency:
  group: freakseek-release-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  CUDA_COMPUTE_CAP: ${{ inputs.compute_cap || '75' }}
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  prebuild-tests:
    name: Pre-build tests
    uses: ./.github/workflows/freakseek-ci.yml

  engine-cpu:
    name: CPU engine
    needs: prebuild-tests
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: native/gguf-engine
      - uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            native/gguf-engine/target
          key: engine-cpu-${{ hashFiles('native/gguf-engine/Cargo.lock', 'native/gguf-engine/src/**') }}
          restore-keys: engine-cpu-
      - name: Build
        working-directory: native/gguf-engine
        run: cargo build --release --locked
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: engine-cpu
          path: native/gguf-engine/target/release/dsh-gguf-engine.exe
          if-no-files-found: error
          retention-days: 3

  engine-cuda:
    name: CUDA engine
    needs: prebuild-tests
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: native/gguf-engine
      - name: Restore engine build cache
        id: engine-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            native/gguf-engine/target
          key: engine-cuda-${{ env.CUDA_COMPUTE_CAP }}-${{ hashFiles('native/gguf-engine/Cargo.lock', 'native/gguf-engine/src/**') }}
          restore-keys: engine-cuda-${{ env.CUDA_COMPUTE_CAP }}-
      - name: Install CUDA Toolkit
        uses: Jimver/cuda-toolkit@v0.2.24
        with:
          cuda: '12.6.3'
          method: network
          use-github-cache: true
          sub-packages: '["nvcc", "cudart", "cublas", "cublas_dev", "curand", "curand_dev", "nvrtc", "nvrtc_dev", "visual_studio_integration"]'
      - uses: ilammy/msvc-dev-cmd@v1.13.0
      - name: Build
        working-directory: native/gguf-engine
        run: |
          cargo build --release --locked --features cuda
          exit $LASTEXITCODE
      - name: Save engine build cache
        if: steps.engine-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            native/gguf-engine/target
          key: engine-cuda-${{ env.CUDA_COMPUTE_CAP }}-${{ hashFiles('native/gguf-engine/Cargo.lock', 'native/gguf-engine/src/**') }}
      - name: Collect the engine and the CUDA DLLs it loads
        run: |
          $exe = 'native/gguf-engine/target/release/dsh-gguf-engine.exe'
          $out = 'engine-cuda'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item $exe $out
          $deps = dumpbin /dependents $exe | ForEach-Object { $_.Trim() } | Where-Object { $_ -match '^(cublas|cublasLt|curand|cudart|nvrtc)\S*\.dll$' }
          if ($deps.Count -eq 0) { throw 'engine imports no CUDA runtime DLL; was it built with --features cuda?' }
          $bin = Join-Path $env:CUDA_PATH 'bin'
          foreach ($dll in $deps) { Copy-Item -LiteralPath (Join-Path $bin $dll) -Destination $out -ErrorAction Stop }
          # Loaded at run time rather than through the import table: cuBLAS loads cuBLASLt; nvrtc loads its builtins.
          if ($deps -match '^cublas64') { Get-ChildItem -Path $bin -Filter 'cublasLt64_*.dll' | Copy-Item -Destination $out }
          if ($deps -match '^nvrtc') { Get-ChildItem -Path $bin -Filter 'nvrtc-builtins64_*.dll' | Copy-Item -Destination $out }
          Get-ChildItem $out | Format-Table Name, Length
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: engine-cuda
          path: engine-cuda
          if-no-files-found: error
          retention-days: 3

  app:
    name: Shell and agent runtime
    needs: prebuild-tests
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v5.0.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: pnpm
      - uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            apps/freakseek-shell/target
          key: shell-${{ hashFiles('apps/freakseek-shell/Cargo.lock', 'apps/freakseek-shell/src/**') }}
          restore-keys: shell-
      - run: |
          pnpm install --frozen-lockfile
          exit $LASTEXITCODE
      - name: Build the agent runtime and client
        run: |
          pnpm run build:artifacts
          exit $LASTEXITCODE
      - name: Build the shell
        working-directory: apps/freakseek-shell
        run: |
          cargo build --release --locked
          exit $LASTEXITCODE
      - name: Assemble the folder without engines
        run: |
          pnpm run assemble:portable -- --platform win32 --node (Get-Command node).Source --shell apps/freakseek-shell/target/release/FreakSeek.exe --out out/FreakSeek
          exit $LASTEXITCODE
      - name: Archive
        run: 7z a -mx=1 -bso0 app.7z ./out/FreakSeek
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: app
          path: app.7z
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

  package:
    name: Assemble and publish
    needs: [app, engine-cpu, engine-cuda]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v7.0.0
        with:
          path: artifacts
      - name: Add engines and zip
        run: |
          set -euo pipefail
          7z x -bso0 artifacts/app/app.7z
          mkdir -p FreakSeek/engine/cpu FreakSeek/engine/cuda
          cp artifacts/engine-cpu/dsh-gguf-engine.exe FreakSeek/engine/cpu/
          cp artifacts/engine-cuda/* FreakSeek/engine/cuda/
          name="FreakSeek-${RELEASE_TAG}-win-x64.zip"
          7z a -tzip -mx=5 -bso0 "$name" FreakSeek
          ls -la "$name"
          echo "ZIP=$name" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: freakseek-win-x64
          path: ${{ env.ZIP }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: FreakSeek ${{ env.RELEASE_TAG }} (Windows x64, portable)
          prerelease: true
          files: ${{ env.ZIP }}
          body: |
            Portable Windows x64 build: unzip anywhere and run FreakSeek.exe. No installer; conversations and settings stay in the folder's data\ directory.

            - Put .gguf models in models\<collection>\ (create collections from the app).
            - CUDA engine for RTX 20-series and newer (compute capability ${{ env.CUDA_COMPUTE_CAP }}+); without an NVIDIA driver, FreakSeek uses the CPU engine automatically.
            - CLI: freakseek.cmd "your task" from the folder.
            - Unsigned: Windows SmartScreen may warn; choose More info → Run anyway.
